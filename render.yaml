# Render blueprint for the FastAPI modeling backend.
# The Next.js frontend deploys separately on Vercel (see DEPLOY.md).
services:
  - type: web
    name: sports-lab-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SPORTS_LAB_SOURCE
        value: real
